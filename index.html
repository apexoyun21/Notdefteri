<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex Yönetim Defteri</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 20px;
        }

        .app-container {
            width: 100%;
            max-width: 500px;
            background: #1e1e1e;
            min-height: 85vh;
            border-radius: 20px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.5);
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding-bottom: 175px; /* Alttaki özet paneli alanı */
        }

        header {
            padding: 20px;
            background: #1a1a1a;
            border-bottom: 1px solid #2d2d2d;
            text-align: center;
        }

        header h2 {
            color: #00adb5;
            font-size: 22px;
            letter-spacing: 0.5px;
        }

        /* Sekmeler */
        .tabs-container {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 15px 20px;
            background: #161616;
            border-bottom: 1px solid #2d2d2d;
        }

        .tabs-container::-webkit-scrollbar {
            display: none;
        }

        .tab-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #252525;
            color: #a0a0a0;
            border: 1px solid #333;
            padding: 10px 16px;
            border-radius: 30px;
            cursor: pointer;
            white-space: nowrap;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .tab-btn svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        .tab-btn.active { color: #fff; }
        .tab-btn.active.tab-all { background: #00adb5; border-color: #00adb5; }
        .tab-btn.active.tab-general { background: #9e9e9e; border-color: #9e9e9e; }
        .tab-btn.active.tab-work { background: #ffd54f; border-color: #ffd54f; color: #121212; }
        .tab-btn.active.tab-diary { background: #ba68c8; border-color: #ba68c8; }
        .tab-btn.active.tab-important { background: #ef5350; border-color: #ef5350; }
        .tab-btn.active.tab-finance { background: #81c784; border-color: #81c784; color: #121212; }

        /* Not Listesi */
        .notes-list {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            flex-grow: 1;
            overflow-y: auto;
            max-height: calc(85vh - 295px);
        }

        .note-card {
            background: #252525;
            padding: 16px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            position: relative;
            border-left: 5px solid #00adb5;
            transition: transform 0.2s, background-color 0.2s;
            cursor: pointer;
        }
        .note-card:hover {
            background: #2a2a2a;
        }

        .note-card.pinned {
            background: #2d2d2d;
            border-right: 2px dashed #ffd54f;
        }

        .note-card.cat-general { border-left-color: #9e9e9e; }
        .note-card.cat-work { border-left-color: #ffd54f; }
        .note-card.cat-diary { border-left-color: #ba68c8; }
        .note-card.cat-important { border-left-color: #ef5350; }
        .note-card.cat-finance.type-income { border-left-color: #4caf50; } 
        .note-card.cat-finance.type-expense { border-left-color: #f44336; } 

        .note-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .note-title-area {
            display: flex;
            align-items: center;
            gap: 8px;
            max-width: 60%;
        }

        .note-title-area svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }

        .note-card h3 {
            font-size: 16px;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .note-card p {
            font-size: 14px;
            color: #b3b3b3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;  
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.4;
        }

        .finance-badge {
            font-size: 13px;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 4px;
            margin-left: auto;
            margin-right: 8px;
        }
        .badge-income { background: rgba(76, 175, 80, 0.2); color: #81c784; }
        .badge-expense { background: rgba(244, 67, 54, 0.2); color: #e57373; }

        /* Buton Grubu */
        .actions-area {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .action-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6px;
            border-radius: 6px;
            transition: background 0.2s, color 0.2s;
        }
        .action-btn:hover { background: #383838; }
        .action-btn svg { width: 16px; height: 16px; fill: currentColor; }
        
        .pin-btn { color: #888; }
        .pin-btn.active { color: #ffd54f; }
        .edit-btn { color: #00adb5; }
        .delete-btn { color: #ff5252; }

        /* FAB Ekleme Butonu (Kalem SVG) */
        .fab-btn {
            position: absolute;
            bottom: 190px; 
            right: 25px;
            width: 56px;
            height: 56px;
            background: #00adb5;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0, 173, 181, 0.4);
            transition: transform 0.2s, background 0.2s;
            z-index: 10;
        }
        .fab-btn:hover { transform: scale(1.05); background: #008c9e; }
        .fab-btn svg { width: 22px; height: 22px; fill: #fff; }

        /* Bütçe Grafiği ve Özet Paneli */
        .summary-panel {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #161616;
            border-top: 2px solid #2d2d2d;
            padding: 15px 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 5;
        }

        .budget-progress-container {
            width: 100%;
            height: 6px;
            background: #2d2d2d;
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 4px;
        }
        .budget-progress-bar {
            height: 100%;
            width: 0%;
            background: #4caf50;
            transition: width 0.3s ease, background-color 0.3s ease;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
        }

        .summary-label { color: #aaa; }
        .summary-value { font-weight: bold; color: #e0e0e0; }
        .summary-value.total-net { color: #00adb5; font-size: 16px; }

        /* Ortak Modal Katmanı */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            padding: 20px;
        }

        .modal-overlay.open { opacity: 1; pointer-events: auto; }

        .modal-content {
            background: #1e1e1e;
            width: 100%;
            max-width: 420px;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 12px;
            transform: translateY(20px);
            transition: transform 0.3s ease;
        }

        .modal-overlay.open .modal-content { transform: translateY(0); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
        .modal-header h3 { color: #00adb5; }
        .close-modal-btn { background: transparent; border: none; color: #aaa; font-size: 20px; cursor: pointer; }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            background: #2d2d2d;
            border: 1px solid #3d3d3d;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }
        input:focus, textarea:focus, select:focus { border-color: #00adb5; }
        textarea { resize: vertical; height: 100px; }
        label { font-size: 12px; color: #888; margin-bottom: -8px; padding-left: 2px;}

        .finance-type-group { display: flex; gap: 10px; margin-top: 5px; }
        .type-btn {
            flex: 1;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #3d3d3d;
            background: #252525;
            color: #aaa;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
            text-align: center;
        }
        .type-btn.active.inc { background: #4caf50; color: #fff; border-color: #4caf50; }
        .type-btn.active.exp { background: #f44336; color: #fff; border-color: #f44336; }

        .save-btn {
            background: #00adb5;
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
            transition: background 0.2s;
            margin-top: 5px;
        }
        .save-btn:hover { background: #008c9e; }

        /* Detay Modalı Özel Tasarımları */
        .detail-body {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 60vh;
            overflow-y: auto;
        }
        .detail-meta-badge {
            align-self: flex-start;
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 20px;
            background: #2d2d2d;
            color: #00adb5;
            font-weight: bold;
            text-transform: uppercase;
        }
        .detail-title-text {
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            padding-bottom: 4px;
            border-bottom: 1px solid #2d2d2d;
        }
        .detail-text {
            font-size: 15px;
            color: #e0e0e0;
            line-height: 1.6;
            white-space: pre-wrap;
            background: #161616;
            padding: 14px;
            border-radius: 8px;
            border-left: 3px solid #333;
        }
        .detail-finance-box {
            background: rgba(0, 173, 181, 0.05);
            border: 1px solid #2d2d2d;
            padding: 12px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h2>Apex Yönetim Defteri</h2>
    </header>

    <div class="tabs-container" id="tabsContainer">
        <button class="tab-btn active tab-all" onclick="filterNotes('all')">
            <svg viewBox="0 0 24 24"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/></svg> Hepsi
        </button>
        <button class="tab-btn tab-general" onclick="filterNotes('general')">
            <svg id="svg-general" viewBox="0 0 24 24"></svg> Genel
        </button>
        <button class="tab-btn tab-work" onclick="filterNotes('work')">
            <svg id="svg-work" viewBox="0 0 24 24"></svg> Okul/İş
        </button>
        <button class="tab-btn tab-diary" onclick="filterNotes('diary')">
            <svg id="svg-diary" viewBox="0 0 24 24"></svg> Günlük
        </button>
        <button class="tab-btn tab-important" onclick="filterNotes('important')">
            <svg id="svg-important" viewBox="0 0 24 24"></svg> Önemli
        </button>
        <button class="tab-btn tab-finance" onclick="filterNotes('finance')">
            <svg id="svg-finance" viewBox="0 0 24 24"></svg> Ekonomi
        </button>
    </div>

    <div class="notes-list" id="notesList"></div>

    <button class="fab-btn" onclick="openModal()">
        <svg viewBox="0 0 24 24">
            <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/>
        </svg>
    </button>

    <div class="summary-panel">
        <div class="summary-row" style="font-size: 12px; margin-bottom: -4px;">
            <span class="summary-label">Aylık Bütçe Tüketimi:</span>
            <span id="progressBarPercent" style="font-weight: bold; color: #aaa;">%0</span>
        </div>
        <div class="budget-progress-container">
            <div class="budget-progress-bar" id="budgetProgressBar"></div>
        </div>
        <div class="summary-row">
            <span class="summary-label">Bu Hafta Ekonomi:</span>
            <span class="summary-value" id="weeklyFinance">G: 0 TL / Ç: 0 TL</span>
        </div>
        <div class="summary-row">
            <span class="summary-label">Bu Ay Ekonomi:</span>
            <span class="summary-value" id="monthlyFinance">G: 0 TL / Ç: 0 TL</span>
        </div>
        <div class="summary-row" style="margin-top: 2px; padding-top: 4px; border-top: 1px solid #2d2d2d;">
            <span class="summary-label" style="color: #fff; font-weight: 500;">Toplam Net Kasa:</span>
            <span class="summary-value total-net" id="totalNetBalance">0 TL</span>
        </div>
    </div>
</div>

<div class="modal-overlay" id="modalOverlay">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="modalMainTitle">Yeni İşlem Ekle</h3>
            <button class="close-modal-btn" onclick="closeModal()">✕</button>
        </div>
        
        <input type="hidden" id="editNoteId" value="">
        
        <label>Kategori Seç:</label>
        <select id="noteCategory" onchange="toggleModalFields()">
            <option value="general">Genel Notlar</option>
            <option value="work">İş / Okul</option>
            <option value="diary">Günlük / Kişisel</option>
            <option value="important">Önemli / Acil</option>
            <option value="finance">Ekonomi (Gelir / Gider)</option>
        </select>

        <input type="text" id="noteTitle" placeholder="Başlık / İşlem Adı...">
        <textarea id="noteContent" placeholder="Detaylı notunuzu buraya yazın..."></textarea>
        
        <div id="financeFields" style="display: none; flex-direction: column; gap: 10px;">
            <label>İşlem Türü:</label>
            <div class="finance-type-group">
                <div class="type-btn active inc" id="typeIncome" onclick="setFinanceType('income')">Gelir (+)</div>
                <div class="type-btn exp" id="typeExpense" onclick="setFinanceType('expense')">Gider (-)</div>
            </div>
            <label>Tarih:</label>
            <input type="date" id="financeDate">
            <label>Miktar (TL):</label>
            <input type="number" id="financeAmount" placeholder="0.00" step="any">
        </div>

        <button class="save-btn" id="saveBtnAction" onclick="saveNote()">Sisteme Kaydet</button>
    </div>
</div>

<div class="modal-overlay" id="detailModalOverlay">
    <div class="modal-content" style="max-width: 450px;">
        <div class="modal-header" style="border-bottom: 1px solid #2d2d2d; padding-bottom: 10px;">
            <h3 style="color: #00adb5;">Kayıt Bilgileri</h3>
            <button class="close-modal-btn" onclick="closeDetailModal()">✕</button>
        </div>
        <div class="detail-body">
            <span id="detailCategoryBadge" class="detail-meta-badge">Kategori</span>
            <div id="detailTitle" class="detail-title-text">Başlık Buraya Gelecek</div>
            <div id="detailFinanceBox" class="detail-finance-box" style="display: none;"></div>
            <div id="detailContent" class="detail-text"></div>
        </div>
    </div>
</div>

<script>
    const svgPaths = {
        general: '<path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/>',
        work: '<path d="M20 6h-4V4c0-1.11-.89-2-2-2h-4c-1.11 0-2 .89-2 2v2H4c-1.11 0-1.99.89-1.99 2L2 19c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zm-6 0h-4V4h4v2z"/>',
        diary: '<path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>',
        important: '<path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>',
        finance: '<path d="M21 18v1c0 1.1-.9 2-2 2H5c-1.11 0-2-.9-2-2V5c0-1.1.89-2 2-2h14c1.1 0 2 .9 2 2v1h-9c-1.11 0-2 .9-2 2v8c0 1.1.89 2 2 2h9zm-9-2h10V8H12v8zm4-2.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/>',
        trash: '<path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/>',
        pencil: '<path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/>',
        pin: '<path d="M16 12V4h1V2H7v2h1v8l-2 2v2h5.2v6h1.6v-6H18v-2l-2-2z"/>'
    };

    const categoryNames = {
        general: "Genel Notlar",
        work: "İş / Okul",
        diary: "Günlük / Kişisel",
        important: "Önemli / Acil",
        finance: "Ekonomi"
    };

    let currentFilter = 'all';
    let selectedFinanceType = 'income';

    document.addEventListener("DOMContentLoaded", () => {
        document.getElementById('svg-general').innerHTML = svgPaths.general;
        document.getElementById('svg-work').innerHTML = svgPaths.work;
        document.getElementById('svg-diary').innerHTML = svgPaths.diary;
        document.getElementById('svg-important').innerHTML = svgPaths.important;
        document.getElementById('svg-finance').innerHTML = svgPaths.finance;
        
        document.getElementById('financeDate').value = new Date().toISOString().split('T')[0];
        displayNotes();
    });

    function openModal() {
        document.getElementById("modalMainTitle").innerText = "Yeni İşlem Ekle";
        document.getElementById("saveBtnAction").innerText = "Sisteme Kaydet";
        document.getElementById("editNoteId").value = "";
        document.getElementById("modalOverlay").classList.add("open");
        toggleModalFields();
    }

    function closeModal() {
        document.getElementById("modalOverlay").classList.remove("open");
    }

        function toggleModalFields() {
        const category = document.getElementById("noteCategory").value;
        document.getElementById("financeFields").style.display = (category === "finance") ? "flex" : "none";
    }

    // Buradan sonrası geliştirilmiş motor yapısı
    function setFinanceType(type) {
        selectedFinanceType = type;
        document.getElementById("typeIncome").classList.toggle("active", type === 'income');
        document.getElementById("typeExpense").classList.toggle("active", type === 'expense');
    }

    function formatDateString(dateStr) {
        if(!dateStr) return "";
        const parts = dateStr.split('-');
        return `${parts[2]}.${parts[1]}.${parts[0]}`;
    }

    // Detay Penceresini Açma (Karta basınca içerideki tüm bilgileri modalda gösterir)
    function openDetailModal(id) {
        const notes = JSON.parse(localStorage.getItem("apex_notebook_v4")) || [];
        const target = notes.find(n => n.id == id);
        if (!target) return;

        // Başlığı yükle
        document.getElementById("detailTitle").innerText = target.title;
        
        // Kategoriyi yükle
        const badge = document.getElementById("detailCategoryBadge");
        badge.innerText = categoryNames[target.category];
        
        // Finans verisi varsa yükle
        const fBox = document.getElementById("detailFinanceBox");
        if (target.category === "finance") {
            fBox.style.display = "flex";
            const typeText = target.financeType === "income" ? "Gelir (+)" : "Gider (-)";
            const color = target.financeType === "income" ? "#81c784" : "#e57373";
            fBox.innerHTML = `
                <div style="display:flex; justify-content:space-between; font-size:14px;">
                    <span style="color:#aaa;">İşlem Tipi:</span>
                    <span style="font-weight:bold; color:${color};">${typeText}</span>
                </div>
                <div style="display:flex; justify-content:space-between; font-size:14px;">
                    <span style="color:#aaa;">Miktar:</span>
                    <span style="font-weight:bold; color:${color};">${target.amount} TL</span>
                </div>
                <div style="display:flex; justify-content:space-between; font-size:14px;">
                    <span style="color:#aaa;">İşlem Tarihi:</span>
                    <span style="color:#fff;">${formatDateString(target.date)}</span>
                </div>
            `;
        } else {
            fBox.style.display = "none";
        }

        // Detaylı not içeriğini yükle
        const contentBox = document.getElementById("detailContent");
        if(target.content) {
            contentBox.innerText = target.content;
            contentBox.style.display = "block";
        } else {
            contentBox.style.display = "none";
        }

        document.getElementById("detailModalOverlay").classList.add("open");
    }

    function closeDetailModal() {
        document.getElementById("detailModalOverlay").classList.remove("open");
    }

    function saveNote() {
        const titleInput = document.getElementById("noteTitle");
        const contentInput = document.getElementById("noteContent");
        const categorySelect = document.getElementById("noteCategory");
        const editId = document.getElementById("editNoteId").value;
        
        const title = titleInput.value.trim();
        const content = contentInput.value.trim();
        const category = categorySelect.value;

        if (title === "") {
            alert("Lütfen bir başlık girin!");
            return;
        }

        let notes = JSON.parse(localStorage.getItem("apex_notebook_v4")) || [];

        if (editId) {
            notes = notes.map(note => {
                if (note.id == editId) {
                    note.title = title;
                    note.content = content;
                    note.category = category;
                    
                    if (category === "finance") {
                        const amt = parseFloat(document.getElementById("financeAmount").value);
                        note.financeType = selectedFinanceType;
                        note.amount = isNaN(amt) ? 0 : amt;
                        note.date = document.getElementById("financeDate").value;
                    } else {
                        delete note.financeType;
                        delete note.amount;
                        delete note.date;
                    }
                }
                return note;
            });
        } else {
            let newNote = {
                id: Date.now(),
                title,
                content,
                category,
                isPinned: false
            };

            if (category === "finance") {
                const amt = parseFloat(document.getElementById("financeAmount").value);
                if (isNaN(amt) || amt <= 0) {
                    alert("Lütfen geçerli bir miktar girin!");
                    return;
                }
                newNote.financeType = selectedFinanceType;
                newNote.amount = amt;
                newNote.date = document.getElementById("financeDate").value;
            }

            notes.unshift(newNote);
        }

        localStorage.setItem("apex_notebook_v4", JSON.stringify(notes));

        titleInput.value = "";
        contentInput.value = "";
        document.getElementById("financeAmount").value = "";
        categorySelect.value = "general";
        setFinanceType('income');
        
        closeModal();
        displayNotes();
    }

    function openEditMode(id) {
        const notes = JSON.parse(localStorage.getItem("apex_notebook_v4")) || [];
        const target = notes.find(n => n.id == id);
        if (!target) return;

        document.getElementById("modalMainTitle").innerText = "Kayıt Düzenle";
        document.getElementById("saveBtnAction").innerText = "Değişiklikleri Kaydet";
        document.getElementById("editNoteId").value = target.id;
        
        document.getElementById("noteTitle").value = target.title;
        document.getElementById("noteContent").value = target.content || "";
        document.getElementById("noteCategory").value = target.category;

        if (target.category === "finance") {
            setFinanceType(target.financeType);
            document.getElementById("financeDate").value = target.date;
            document.getElementById("financeAmount").value = target.amount;
        }

        document.getElementById("modalOverlay").classList.add("open");
        toggleModalFields();
    }

    function togglePin(id) {
        let notes = JSON.parse(localStorage.getItem("apex_notebook_v4")) || [];
        notes = notes.map(n => {
            if (n.id == id) n.isPinned = !n.isPinned;
            return n;
        });
        localStorage.setItem("apex_notebook_v4", JSON.stringify(notes));
        displayNotes();
    }

    function displayNotes() {
        const notesList = document.getElementById("notesList");
        let notes = JSON.parse(localStorage.getItem("apex_notebook_v4")) || [];

        notesList.innerHTML = "";

        const today = new Date();
        const currentDay = today.getDay();
        const distanceToMonday = currentDay === 0 ? 6 : currentDay - 1;
        const startOfWeek = new Date(today);
        startOfWeek.setDate(today.getDate() - distanceToMonday);
        startOfWeek.setHours(0,0,0,0);

        const startOfMonth = new Date(today.getFullYear(), today.getMonth(), 1);

        let weekInc = 0, weekExp = 0;
        let monthInc = 0, monthExp = 0;
        let totalNet = 0;

        notes.forEach(note => {
            if (note.category === "finance") {
                const amt = note.amount || 0;
                const noteDate = new Date(note.date);
                noteDate.setHours(0,0,0,0);

                if (note.financeType === "income") {
                    totalNet += amt;
                    if (noteDate >= startOfWeek && noteDate <= today) weekInc += amt;
                    if (noteDate >= startOfMonth && noteDate <= today) monthInc += amt;
                } else {
                    totalNet -= amt;
                    if (noteDate >= startOfWeek && noteDate <= today) weekExp += amt;
                    if (noteDate >= startOfMonth && noteDate <= today) monthExp += amt;
                }
            }
        });

        const bar = document.getElementById("budgetProgressBar");
        const percentText = document.getElementById("progressBarPercent");
        if (monthInc > 0) {
            let pct = Math.min((monthExp / monthInc) * 100, 100);
            bar.style.width = `${pct}%`;
            percentText.innerText = `%${Math.round(pct)}`;
            bar.style.backgroundColor = (pct >= 90) ? "#f44336" : (pct >= 65 ? "#ff9800" : "#4caf50");
        } else {
            bar.style.width = monthExp > 0 ? "100%" : "0%";
            percentText.innerText = monthExp > 0 ? "Bütçe Aşıldı!" : "%0";
            bar.style.backgroundColor = monthExp > 0 ? "#f44336" : "#4caf50";
        }

        if (currentFilter !== 'all') {
            notes = notes.filter(note => note.category === currentFilter);
        }

        notes.sort((a, b) => (b.isPinned ? 1 : 0) - (a.isPinned ? 1 : 0));

        if (notes.length === 0) {
            notesList.innerHTML = '<p style="text-align:center; color:#555; margin-top:40px;">Kayıt bulunamadı.</p>';
        }

        notes.forEach(note => {
            const card = document.createElement("div");
            
            let financeBadgeHtml = "";
            let extraClass = note.isPinned ? "pinned" : "";
            let footerHtml = "";

            if (note.category === "finance") {
                extraClass += note.financeType === "income" ? " type-income" : " type-expense";
                const badgeText = note.financeType === "income" ? `+${note.amount} TL` : `-${note.amount} TL`;
                const badgeClass = note.financeType === "income" ? "badge-income" : "badge-expense";
                financeBadgeHtml = `<span class="finance-badge ${badgeClass}">${badgeText}</span>`;
                footerHtml = `<div style="font-size:11px; color:#666; margin-top:8px; text-align:right;">İşlem Tarihi: ${formatDateString(note.date)}</div>`;
            }

            card.className = `note-card cat-${note.category} ${extraClass}`;
            card.setAttribute("onclick", `openDetailModal(${note.id})`);

            card.innerHTML = `
                <div class="note-header">
                    <div class="note-title-area">
                        <svg viewBox="0 0 24 24" style="fill: currentColor;">${svgPaths[note.category]}</svg>
                        <h3>${note.title}</h3>
                    </div>
                    ${financeBadgeHtml}
                    <div class="actions-area">
                        <button class="action-btn pin-btn ${note.isPinned ? 'active' : ''}" onclick="event.stopPropagation(); togglePin(${note.id})" title="Sabitle">
                            <svg viewBox="0 0 24 24">${svgPaths.pin}</svg>
                        </button>
                        <button class="action-btn edit-btn" onclick="event.stopPropagation(); openEditMode(${note.id})" title="Düzenle">
                            <svg viewBox="0 0 24 24">${svgPaths.pencil}</svg>
                        </button>
                        <button class="action-btn delete-btn" onclick="event.stopPropagation(); deleteNote(${note.id})" title="Sil">
                            <svg viewBox="0 0 24 24">${svgPaths.trash}</svg>
                        </button>
                    </div>
                </div>
                ${note.content ? `<p>${note.content}</p>` : ''}
                ${footerHtml}
            `;
            notesList.appendChild(card);
        });

        document.getElementById("weeklyFinance").innerText = `G: +${weekInc} TL / Ç: -${weekExp} TL`;
        document.getElementById("monthlyFinance").innerText = `G: +${monthInc} TL / Ç: -${monthExp} TL`;
        
        const netElement = document.getElementById("totalNetBalance");
        netElement.innerText = `${totalNet} TL`;
        if (totalNet > 0) netElement.style.color = "#81c784";
        else if (totalNet < 0) netElement.style.color = "#e57373";
        else netElement.style.color = "#00adb5";
    }

    function deleteNote(id) {
        let notes = JSON.parse(localStorage.getItem("apex_notebook_v4")) || [];
        notes = notes.filter(note => note.id !== id);
        localStorage.setItem("apex_notebook_v4", JSON.stringify(notes));
        displayNotes();
    }

    function filterNotes(category) {
        currentFilter = category;
        const buttons = document.querySelectorAll(".tab-btn");
        buttons.forEach(btn => btn.classList.remove("active"));
        event.currentTarget.classList.add("active");
        displayNotes();
    }
</script>

</body>
</html>
